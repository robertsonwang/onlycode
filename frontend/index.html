<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python Practice Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #fef8ee;
        --bg-2: #f3efe4;
        --ink: #1e293b;
        --muted: #5f6c82;
        --accent: #0f766e;
        --accent-2: #d97706;
        --panel: rgba(255, 255, 255, 0.8);
        --border: rgba(15, 23, 42, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 10%, rgba(15, 118, 110, 0.15), transparent 40%),
          radial-gradient(circle at 80% 90%, rgba(217, 119, 6, 0.12), transparent 35%),
          linear-gradient(160deg, var(--bg-1), var(--bg-2));
      }

      .app {
        max-width: 100%;
        margin: 0;
        padding: 0.6rem;
        display: grid;
        gap: 0.5rem;
        grid-template-columns: 1fr;
        height: 100vh;
        grid-template-rows: auto 1fr;
      }

      .card {
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(8px);
        border-radius: 8px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      }

      .header {
        padding: 0.5rem 0.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .title {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 700;
      }

      .subtitle {
        color: var(--muted);
        margin: 0.3rem 0 0;
        font-size: 0.95rem;
      }

      .controls {
        display: flex;
        gap: 0.7rem;
        align-items: center;
      }

      select,
      button {
        font-family: inherit;
        font-size: 0.95rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 0.55rem 0.75rem;
        background: white;
      }

      button {
        background: linear-gradient(120deg, var(--accent), #0ea5a4);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .main {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;
        overflow: hidden;
        min-height: 0;
      }

      .problem-panel,
      .editor-panel,
      .result-panel {
        padding: 0.7rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .resize-handle {
        display: none;
      }

      @media (min-width: 980px) {
        .resize-handle {
          display: block;
          width: 6px;
          cursor: col-resize;
          background: transparent;
          position: relative;
          z-index: 10;
          border-radius: 3px;
          transition: background 0.2s;
        }

        .resize-handle:hover,
        .resize-handle.active {
          background: var(--accent);
        }
      }

      .resize-handle-h {
        height: 6px;
        cursor: row-resize;
        background: transparent;
        border-radius: 3px;
        transition: background 0.2s;
        grid-column: 1 / -1;
      }

      .resize-handle-h:hover,
      .resize-handle-h.active {
        background: var(--accent);
      }

      .problem-content {
        overflow: auto;
        line-height: 1.55;
        flex: 1;
      }

      .problem-content h1,
      .problem-content h2,
      .problem-content h3 {
        margin: 0.9rem 0 0.4rem;
        line-height: 1.3;
      }

      .problem-content h1:first-child,
      .problem-content h2:first-child,
      .problem-content h3:first-child {
        margin-top: 0;
      }

      .problem-content p {
        margin: 0.5rem 0;
      }

      .problem-content ul,
      .problem-content ol {
        margin: 0.4rem 0;
        padding-left: 1.4rem;
      }

      .problem-content li {
        margin: 0.2rem 0;
      }

      .problem-content code {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.85em;
        background: rgba(15, 23, 42, 0.07);
        padding: 0.1rem 0.35rem;
        border-radius: 5px;
      }

      .problem-content pre {
        background: rgba(15, 23, 42, 0.06);
        border-radius: 10px;
        padding: 0.7rem 0.9rem;
        overflow-x: auto;
      }

      .problem-content pre code {
        background: none;
        padding: 0;
      }

      .problem-content blockquote {
        margin: 0.5rem 0;
        padding-left: 0.8rem;
        border-left: 3px solid var(--border);
        color: var(--muted);
      }

      .problem-content table {
        width: auto;
      }

      #editor {
        flex: 1;
        min-height: 200px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .terminal-panel {
        padding: 0.7rem;
        display: none;
        height: 350px;
        min-height: 100px;
      }

      .terminal-panel.visible {
        display: flex;
        flex-direction: column;
      }

      .result-panel.hidden {
        display: none;
      }

      .terminal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }

      .terminal-header h2 {
        margin: 0;
      }

      .terminal-close-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #b91c1c;
        font-size: 0.85rem;
        padding: 0.4rem 0.7rem;
      }

      #terminal-container {
        flex: 1;
        min-height: 100px;
        border-radius: 10px;
        overflow: hidden;
        background: #1e1e1e;
        border: 1px solid var(--border);
      }

      .btn-debug {
        background: linear-gradient(120deg, var(--accent-2), #f59e0b);
      }

      .result-panel {
        height: 250px;
        min-height: 80px;
      }

      #resultTable {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }

      .result-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .badge {
        padding: 0.3rem 0.6rem;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.8rem;
      }

      .badge.pass {
        background: rgba(16, 185, 129, 0.15);
        color: #047857;
      }

      .badge.fail {
        background: rgba(239, 68, 68, 0.15);
        color: #b91c1c;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-family: "JetBrains Mono", monospace;
        font-size: 0.83rem;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 0.45rem;
        text-align: left;
        vertical-align: top;
      }

      .error {
        color: #b91c1c;
        font-weight: 600;
      }

      @media (min-width: 980px) {
        .main {
          grid-template-columns: 1fr 6px 1fr;
          grid-template-rows: 1fr auto auto;
        }

        .problem-panel {
          grid-column: 1;
          grid-row: 1;
        }

        .resize-handle {
          grid-column: 2;
          grid-row: 1;
        }

        .editor-panel {
          grid-column: 3;
          grid-row: 1;
        }

        .result-panel,
        .terminal-panel {
          grid-column: 1 / -1;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="card header">
        <div>
          <h1 class="title">OnlyCode</h1>
          <p class="subtitle">LeetCode-style practice with instant testcase feedback</p>
        </div>
        <div class="controls">
          <select id="problemSelect"></select>
          <button id="runBtn">Run Submission</button>
          <button id="debugBtn" class="btn-debug">Debug</button>
        </div>
      </section>

      <section class="main">
        <article class="card problem-panel" id="problemPanel">
          <h2>Problem</h2>
          <div id="problemMeta"></div>
          <div id="problemContent" class="problem-content">Loading...</div>
        </article>

        <div class="resize-handle" id="resizeHandle"></div>

        <article class="card editor-panel" id="editorPanel">
          <h2 id="editorTitle">Code Editor</h2>
          <div id="editor"></div>
        </article>

        <div class="resize-handle-h" id="resizeHandleResult"></div>

        <article class="card result-panel" id="resultPanel">
          <div class="result-head">
            <h2>Results</h2>
            <span id="statusBadge" class="badge">Not run</span>
          </div>
          <div id="errorBox" class="error"></div>
          <div id="resultTable">Run your code to see testcase results.</div>
        </article>

        <div class="resize-handle-h" id="resizeHandleTerminal"></div>

        <article class="card terminal-panel" id="terminalPanel">
          <div class="terminal-header">
            <h2>Debug Terminal</h2>
            <button class="terminal-close-btn" id="terminalCloseBtn">Close</button>
          </div>
          <div id="terminal-container"></div>
        </article>
      </section>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    <script>
      const API_BASE = "http://127.0.0.1:8000";
      let editor;
      let currentProblemId = null;

      const selectEl = document.getElementById("problemSelect");
      const runBtn = document.getElementById("runBtn");
      const problemMetaEl = document.getElementById("problemMeta");
      const problemContentEl = document.getElementById("problemContent");
      const resultTableEl = document.getElementById("resultTable");
      const resultPanelEl = document.getElementById("resultPanel");
      const statusBadgeEl = document.getElementById("statusBadge");
      const errorBoxEl = document.getElementById("errorBox");
      const editorTitleEl = document.getElementById("editorTitle");

      function setStatus(label, isPass = null) {
        statusBadgeEl.textContent = label;
        statusBadgeEl.className = "badge";
        if (isPass === true) statusBadgeEl.classList.add("pass");
        if (isPass === false) statusBadgeEl.classList.add("fail");
      }

      function renderResults(results) {
        if (!results || results.length === 0) {
          resultTableEl.textContent = "No test cases returned.";
          return;
        }

        const rows = results
          .map(
            (r) => `
              <tr>
                <td>${r.case_index}</td>
                <td>${r.passed ? "PASS" : "FAIL"}</td>
                <td><pre>${JSON.stringify(r.input, null, 2)}</pre></td>
                <td><pre>${JSON.stringify(r.expected_output, null, 2)}</pre></td>
                <td><pre>${JSON.stringify(r.actual_output, null, 2)}</pre></td>
                <td>${r.runtime_ms}</td>
              </tr>
            `
          )
          .join("");

        resultTableEl.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Status</th>
                <th>Input</th>
                <th>Expected</th>
                <th>Actual</th>
                <th>Runtime (ms)</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      }

      async function loadProblems() {
        const resp = await fetch(`${API_BASE}/problems`);
        if (!resp.ok) throw new Error("Could not load problems list");
        const problems = await resp.json();

        selectEl.innerHTML = "";
        problems.forEach((p) => {
          const option = document.createElement("option");
          option.value = p.id;
          option.textContent = `${p.title} (${p.difficulty})`;
          selectEl.appendChild(option);
        });

        if (problems.length > 0) {
          const lastId = localStorage.getItem("lastProblemId");
          const startId = problems.find(p => p.id === lastId) ? lastId : problems[0].id;
          selectEl.value = startId;
          await loadProblem(startId);
        }
      }

      async function loadProblem(problemId) {
        // Save current editor content before switching
        if (currentProblemId && editor) {
          localStorage.setItem(`code_${currentProblemId}`, editor.getValue());
        }

        const resp = await fetch(`${API_BASE}/problems/${problemId}`);
        if (!resp.ok) throw new Error("Could not load problem");

        const data = await resp.json();
        currentProblemId = data.id;
        localStorage.setItem("lastProblemId", data.id);
        problemMetaEl.textContent = `${data.title} | Difficulty: ${data.difficulty}`;
        const renderedHtml = marked.parse(data.problem_markdown || "");
        problemContentEl.innerHTML = DOMPurify.sanitize(renderedHtml);
        renderLatex(problemContentEl);

        // Restore saved code or use starter
        const savedCode = localStorage.getItem(`code_${data.id}`);
        editor.setValue(savedCode !== null ? savedCode : data.starter_code);

        const language = data.editor_language || "python";
        monaco.editor.setModelLanguage(editor.getModel(), language);
        editorTitleEl.textContent = language === "sql" ? "SQL Editor" : "Code Editor";

        setStatus("Ready");
        errorBoxEl.textContent = "";
        resultTableEl.textContent = "Run your code to see testcase results.";
      }

      async function submitSolution() {
        if (!currentProblemId) return;
        closeDebugTerminal();
        resultPanelEl.classList.remove("hidden");
        runBtn.disabled = true;
        setStatus("Running...");
        errorBoxEl.textContent = "";

        try {
          const resp = await fetch(`${API_BASE}/submit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              problem_id: currentProblemId,
              code: editor.getValue(),
            }),
          });

          const data = await resp.json();
          if (!resp.ok) {
            throw new Error(data.detail || "Submission failed");
          }

          setStatus(data.all_passed ? "All Passed" : "Failed", data.all_passed);
          if (data.error) {
            errorBoxEl.textContent = data.error;
          }
          renderResults(data.results);
        } catch (err) {
          setStatus("Error", false);
          errorBoxEl.textContent = err.message;
        } finally {
          runBtn.disabled = false;
        }
      }

      function initEditor() {
        require.config({
          paths: {
            vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs",
          },
        });
        require(["vs/editor/editor.main"], () => {
          editor = monaco.editor.create(document.getElementById("editor"), {
            value: "def solve(input_data):\n    # write your solution\n    return None\n",
            language: "python",
            theme: "vs",
            minimap: { enabled: false },
            fontFamily: "JetBrains Mono",
            fontSize: 14,
            automaticLayout: true,
          });

          // Auto-save on every edit
          editor.onDidChangeModelContent(() => {
            if (currentProblemId) {
              localStorage.setItem(`code_${currentProblemId}`, editor.getValue());
            }
          });

          loadProblems().catch((err) => {
            setStatus("Error", false);
            errorBoxEl.textContent = err.message;
          });
        });
      }

      selectEl.addEventListener("change", (e) => {
        loadProblem(e.target.value).catch((err) => {
          setStatus("Error", false);
          errorBoxEl.textContent = err.message;
        });
      });
      runBtn.addEventListener("click", submitSolution);

      // --- Debug Terminal ---
      const WS_BASE = "ws://127.0.0.1:8000";
      const debugBtn = document.getElementById("debugBtn");
      const terminalPanel = document.getElementById("terminalPanel");
      const terminalCloseBtn = document.getElementById("terminalCloseBtn");
      const terminalContainer = document.getElementById("terminal-container");

      let term = null;
      let fitAddon = null;
      let debugSocket = null;

      function openDebugTerminal() {
        if (!currentProblemId) return;

        // Show terminal panel
        resultPanelEl.classList.add("hidden");
        terminalPanel.classList.add("visible");

        // Create or reset terminal
        if (term) {
          term.dispose();
        }

        term = new window.Terminal({
          fontFamily: "JetBrains Mono, monospace",
          fontSize: 14,
          theme: {
            background: "#1e1e1e",
            foreground: "#d4d4d4",
            cursor: "#d4d4d4",
          },
          cursorBlink: true,
          convertEol: true,
        });

        fitAddon = new window.FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(terminalContainer);
        fitAddon.fit();

        term.writeln("\x1b[1;36mConnecting to debug session...\x1b[0m\r\n");

        // Connect WebSocket
        if (debugSocket) {
          debugSocket.close();
        }

        debugSocket = new WebSocket(`${WS_BASE}/ws/debug`);
        debugSocket.binaryType = "arraybuffer";

        debugSocket.onopen = () => {
          // Send code and problem_id
          debugSocket.send(JSON.stringify({
            code: editor.getValue(),
            problem_id: currentProblemId,
          }));
        };

        debugSocket.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            const text = new TextDecoder().decode(event.data);
            term.write(text);
          } else {
            term.write(event.data);
          }
        };

        debugSocket.onclose = () => {
          term.writeln("\r\n\x1b[90m--- Session ended ---\x1b[0m");
        };

        debugSocket.onerror = () => {
          term.writeln("\r\n\x1b[31mWebSocket error. Is the backend running?\x1b[0m");
        };

        // Send user keystrokes to PTY
        term.onData((data) => {
          if (debugSocket && debugSocket.readyState === WebSocket.OPEN) {
            debugSocket.send(new TextEncoder().encode(data));
          }
        });

        // Handle window resize
        window.addEventListener("resize", () => {
          if (fitAddon) fitAddon.fit();
        });
      }

      function closeDebugTerminal() {
        if (debugSocket) {
          debugSocket.close();
          debugSocket = null;
        }
        if (term) {
          term.dispose();
          term = null;
        }
        terminalPanel.classList.remove("visible");
      }

      debugBtn.addEventListener("click", openDebugTerminal);
      terminalCloseBtn.addEventListener("click", closeDebugTerminal);

      // --- LaTeX rendering with KaTeX ---
      function renderLatex(el) {
        // Block math: $$...$$
        el.innerHTML = el.innerHTML.replace(/\$\$([\s\S]*?)\$\$/g, (match, tex) => {
          try {
            return katex.renderToString(tex.trim(), { displayMode: true, throwOnError: false });
          } catch (e) { return match; }
        });
        // Inline math: $...$  (not preceded/followed by $)
        el.innerHTML = el.innerHTML.replace(/(?<!\$)\$(?!\$)([^$\n]+?)\$(?!\$)/g, (match, tex) => {
          try {
            return katex.renderToString(tex.trim(), { displayMode: false, throwOnError: false });
          } catch (e) { return match; }
        });
      }

      // --- Resizable panels ---
      (function setupResize() {
        const handle = document.getElementById("resizeHandle");
        const main = document.querySelector(".main");
        if (!handle) return;

        let dragging = false;

        handle.addEventListener("mousedown", (e) => {
          e.preventDefault();
          dragging = true;
          handle.classList.add("active");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const rect = main.getBoundingClientRect();
          const offset = e.clientX - rect.left;
          const pct = (offset / rect.width) * 100;
          if (pct > 20 && pct < 80) {
            main.style.gridTemplateColumns = `${pct}% 6px 1fr`;
            if (editor) editor.layout();
          }
        });

        document.addEventListener("mouseup", () => {
          if (dragging) {
            dragging = false;
            handle.classList.remove("active");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
          }
        });
      })();

      // --- Vertical resize for result and terminal panels ---
      function setupVerticalResize(handleId, panelId, onResize) {
        const handle = document.getElementById(handleId);
        const panel = document.getElementById(panelId);
        if (!handle || !panel) return;

        let dragging = false;
        let startY = 0;
        let startHeight = 0;

        handle.addEventListener("mousedown", (e) => {
          e.preventDefault();
          dragging = true;
          startY = e.clientY;
          startHeight = panel.getBoundingClientRect().height;
          handle.classList.add("active");
          document.body.style.cursor = "row-resize";
          document.body.style.userSelect = "none";
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging) return;
          const delta = e.clientY - startY;
          const newHeight = Math.max(80, startHeight + delta);
          panel.style.height = newHeight + "px";
          if (onResize) onResize();
        });

        document.addEventListener("mouseup", () => {
          if (dragging) {
            dragging = false;
            handle.classList.remove("active");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
          }
        });
      }

      setupVerticalResize("resizeHandleResult", "resultPanel");
      setupVerticalResize("resizeHandleTerminal", "terminalPanel", () => {
        if (fitAddon) fitAddon.fit();
      });

      initEditor();
    </script>
  </body>
</html>
