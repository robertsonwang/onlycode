[project]
name = "onlycode"
version = "0.1.0"
description = "Local LeetCode-style Python practice app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "numpy",
  "websockets",
  "scikit-learn>=1.9.0",
  "duckdb>=1.5.6",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]

[tool.uv]
package = false
